name: Pipeline CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -q

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t cloud-data-engineering-pipeline:ci \
            .

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t cloud-data-engineering-pipeline:ci \
            .

      - name: Run container
        run: |
          docker run \
            --rm \
            -e ENVIRONMENT=ci \
            -e MAX_RETRIES=3 \
            -e INITIAL_RETRY_DELAY=1 \
            -e API_URL=https://jsonplaceholder.typicode.com/posts \
            -e POSTS_API_URL=https://jsonplaceholder.typicode.com/posts \
            -e USERS_API_URL=https://jsonplaceholder.typicode.com/users \
            cloud-data-engineering-pipeline:ci

